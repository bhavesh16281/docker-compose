services:
  rabbit:
    image: "rabbitmq:4-management"
    hostname: "rabbitmq"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    extends:
      file: common-config.yml
      service: network-deploy-service


  configserver:
    image: "bhavesh16281/configserver:04"
    container_name: "configserver-ms"
    ports:
      - "8071:8071"
    depends_on:
      rabbit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config
    environment:
      SPRING_CLOUD_STREAM_BINDINGS_SPRINGCLOUDBUSINPUT_GROUP: "configserver"


  accounts:
    image: "bhavesh16281/accounts:01"
    container_name: "accounts-ms"
    ports:
      - "8080:8080"
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "accounts"
      SPRING_CLOUD_STREAM_BINDINGS_SPRINGCLOUDBUSINPUT_GROUP: "accounts"
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    


  loans:
    image: "bhavesh16281/loans:02"
    container_name: "loans-ms"
    ports:
      - "8090:8090"
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "loans"
      SPRING_CLOUD_STREAM_BINDINGS_SPRINGCLOUDBUSINPUT_GROUP: "loans"
    extends:
      file: common-config.yml
      service: microservice-configserver-config



  cards:
    image: "bhavesh16281/cards:03"
    container_name: "cards-ms"
    ports:
      - "9000:9000"
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "cards"
      SPRING_CLOUD_STREAM_BINDINGS_SPRINGCLOUDBUSINPUT_GROUP: "cards"
    extends:
      file: common-config.yml
      service: microservice-configserver-config



networks:
    banking-network:
        driver: "bridge"

